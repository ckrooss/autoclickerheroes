[project]
name = "autoclickerheroes"

requires-python = ">= 3.10"
dynamic = ["version"]
dependencies = [
  "opencv-python",
  "numpy",
  "pymouse",
  "pyuserinput",
  "pyscreenshot",
  "pynput>=1.7.7",
  "pygetwindow>=0.0.9",
  "ruff"
]

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autoclickerheroes"]
exclude = ["templates"]

[project.scripts]
ngu = "autoclickerheroes.ngu_attacker:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN", "T201"]