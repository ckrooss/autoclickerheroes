[project]
name = "autoclickerheroes"

requires-python = ">= 3.10"
version = "1.0.0"
dependencies = [
  "opencv-python",
  "numpy",
  "pymouse",
  "pyuserinput",
  "pyscreenshot",
  "pynput>=1.8.2",
  "pygetwindow>=0.0.9",
  "ruff",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

#[tool.setuptools.packages.find]
#include = ["autoclickerheroes"]
#exclude = ["templates"]

[project.scripts]
ngu = "autoclickerheroes.ngu_attacker:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN", "T201"]
